services:
  api:
    build:
      context: .
    container_name: ai-agent-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # Монтируем весь проект
      - ./data:/app/data  # Отдельный том для данных
    environment:
      - .env.docker
